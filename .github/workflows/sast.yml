name: SAST

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    name: Semgrep / OpenGrep rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Semgrep
        run: python -m pip install --upgrade semgrep

      - name: Validate rulepack
        run: semgrep scan --validate --config security/opengrep

      - name: Full scan (report-only, all severities)
        run: semgrep scan --config security/opengrep --sarif --output semgrep.sarif

      - name: Blocking scan (ERROR severity)
        run: semgrep scan --config security/opengrep --severity ERROR --error

      - name: Upload SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
