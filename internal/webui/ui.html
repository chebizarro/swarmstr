<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metiq</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  /* Cyberwave Theme - Electric Purple, Neon Blue, Cyberpunk Aesthetic */
  --bg: #0a0a0f;
  --surface: #16161d;
  --border: #2a2a38;
  --accent: #B026FF;        /* Bright electric purple */
  --accent-bright: #D580FF; /* Lighter neon purple */
  --accent-dim: #7A1CAC;    /* Deep dark purple */
  --accent-hover: #C850FF;
  --accent-glow: rgba(176, 38, 255, 0.3);
  --text: #e8e8f5;
  --text-muted: #9D9DAF;    /* Muted purple-gray */
  --user-bubble: #1f1835;
  --user-border: #3d2a5f;
  --agent-bubble: #151a28;
  --agent-border: #2a3048;
  --error: #FF006E;         /* Hot neon pink */
  --success: #39FF14;       /* Neon green */
  --warn: #FFD700;          /* Electric gold */
  --info: #00D4FF;          /* Electric cyan */
  --font: ui-sans-serif, system-ui, -apple-system, sans-serif;
  --mono: ui-monospace, SFMono-Regular, monospace;
}
body.theme-light {
  --bg: #f8f7fb;
  --surface: #ffffff;
  --border: #d8d3e6;
  --accent: #7A1CAC;
  --accent-bright: #4f1280;
  --accent-dim: #b892d7;
  --accent-hover: #63208e;
  --accent-glow: rgba(122, 28, 172, 0.16);
  --text: #181525;
  --text-muted: #625b73;
  --user-bubble: #f0e6ff;
  --user-border: #d5bdf2;
  --agent-bubble: #f5f8ff;
  --agent-border: #d4dcee;
}
body {
  background: var(--bg);
  background-image:
    radial-gradient(ellipse at 20% 0%, rgba(176, 38, 255, 0.08) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 100%, rgba(0, 212, 255, 0.06) 0%, transparent 50%);
  color: var(--text);
  font-family: var(--font);
  height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
}

/* ── Header ── */
header {
  padding: 0.6rem 1rem;
  background: var(--surface);
  border-bottom: 1px solid var(--accent-dim);
  box-shadow: 0 2px 12px rgba(176, 38, 255, 0.1);
  display: flex; align-items: center; gap: 0.75rem; flex-shrink: 0;
}
header h1 {
  font-size: 0.95rem; font-weight: 700; letter-spacing: 0.05em;
  background: linear-gradient(135deg, var(--accent-bright), var(--info));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.mobile-menu-btn {
  display: none;
  width: 38px; height: 38px; align-items: center; justify-content: center;
  border: 1px solid var(--border); border-radius: 0.45rem;
  background: rgba(10, 10, 15, 0.45); color: var(--accent-bright);
  font-size: 1.1rem; cursor: pointer;
}
.status-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--text-muted); flex-shrink: 0; transition: background 0.3s, box-shadow 0.3s;
}
.status-dot.connected {
  background: var(--success);
  box-shadow: 0 0 8px var(--success), 0 0 4px var(--success);
}
.status-dot.error {
  background: var(--error);
  box-shadow: 0 0 8px var(--error), 0 0 4px var(--error);
}
.header-actions { margin-left: auto; display: flex; gap: 0.4rem; align-items: center; }
.icon-btn, .locale-select {
  border: 1px solid var(--border); border-radius: 0.4rem;
  background: rgba(10, 10, 15, 0.35); color: var(--text-muted);
  min-height: 32px; padding: 0.25rem 0.45rem; cursor: pointer; font-size: 0.72rem;
}
.icon-btn:hover, .locale-select:hover { color: var(--accent-bright); border-color: var(--accent); }
.search-box {
  display: none; width: min(220px, 32vw); min-height: 32px;
  border: 1px solid var(--border); border-radius: 0.4rem; background: var(--bg); color: var(--text);
  padding: 0.25rem 0.5rem; font-size: 0.72rem;
}
.search-box.visible { display: block; }
.header-info { color: var(--text-muted); font-size: 0.72rem; display: flex; gap: 0.75rem; align-items: center; }
.badge {
  background: rgba(122, 28, 172, 0.15);
  border: 1px solid var(--accent-dim);
  border-radius: 9999px; padding: 0.1rem 0.55rem; font-size: 0.68rem; font-family: var(--mono);
  color: var(--accent-bright);
}
.badge.warn {
  color: var(--warn);
  border-color: var(--warn);
  background: rgba(255, 215, 0, 0.1);
  box-shadow: 0 0 6px rgba(255, 215, 0, 0.2);
}

/* ── Layout ── */
.layout { flex: 1; display: flex; overflow: hidden; }
.sidebar-backdrop {
  display: none; position: fixed; inset: 0;
  background: rgba(0, 0, 0, 0.55); backdrop-filter: blur(1px);
  z-index: 70;
}

/* ── Sidebar ── */
.sidebar {
  width: 220px; flex-shrink: 0;
  background: var(--surface);
  border-right: 1px solid var(--accent-dim);
  box-shadow: 2px 0 12px rgba(176, 38, 255, 0.1);
  display: flex; flex-direction: column; overflow: hidden;
}
.sidebar-tabs {
  display: flex; flex-wrap: wrap; border-bottom: 1px solid var(--border);
}
.tab-btn {
  flex: 1 1 33.333%; padding: 0.55rem 0.4rem; font-size: 0.7rem; font-weight: 600;
  color: var(--text-muted); background: none; border: none; cursor: pointer;
  letter-spacing: 0.04em; transition: color 0.15s, border-bottom 0.15s, text-shadow 0.15s;
  border-bottom: 2px solid transparent;
}
.tab-btn.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
  text-shadow: 0 0 8px var(--accent-glow);
}
.tab-panel { display: none; flex: 1; overflow-y: auto; padding: 0.5rem 0; }
.tab-panel.active { display: block; }
.sidebar-item {
  padding: 0.45rem 0.85rem; font-size: 0.75rem; cursor: pointer;
  border-left: 2px solid transparent; color: var(--text-muted);
  transition: background 0.1s, color 0.1s, border-left-color 0.1s;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.sidebar-item:hover {
  background: rgba(176, 38, 255, 0.08);
  color: var(--text);
}
.sidebar-item.active {
  color: var(--accent-bright);
  border-left-color: var(--accent);
  background: rgba(176, 38, 255, 0.12);
  box-shadow: inset 2px 0 8px rgba(176, 38, 255, 0.2);
}
.sidebar-item .sub { font-size: 0.65rem; color: var(--text-muted); margin-top: 0.15rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sidebar-section { padding: 0.65rem 0.85rem 0.25rem; font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; }
.sidebar-empty { padding: 0.75rem 0.85rem; font-size: 0.72rem; color: var(--text-muted); font-style: italic; }
.new-session-btn {
  margin: 0.5rem 0.75rem; padding: 0.4rem 0.75rem; background: none;
  border: 1px solid var(--border); border-radius: 0.4rem; color: var(--text-muted);
  font-size: 0.72rem; cursor: pointer; width: calc(100% - 1.5rem); text-align: left;
  transition: border-color 0.15s, color 0.15s, box-shadow 0.15s;
}
.new-session-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
  box-shadow: 0 0 12px rgba(176, 38, 255, 0.2);
}
.channel-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--success);
  display: inline-block; margin-right: 0.4rem; flex-shrink: 0;
  box-shadow: 0 0 6px var(--success), 0 0 3px var(--success);
}

/* ── Main conversation ── */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
#messages {
  flex: 1; overflow-y: auto; padding: 1rem 0;
  display: flex; flex-direction: column; gap: 0.5rem; scroll-behavior: smooth;
}
#messages::-webkit-scrollbar { width: 6px; }
#messages::-webkit-scrollbar-track { background: rgba(176, 38, 255, 0.03); }
#messages::-webkit-scrollbar-thumb {
  background: linear-gradient(180deg, var(--accent-dim), var(--accent));
  border-radius: 9999px;
  box-shadow: 0 0 6px rgba(176, 38, 255, 0.4);
}
#messages::-webkit-scrollbar-thumb:hover {
  background: linear-gradient(180deg, var(--accent), var(--accent-bright));
}
.msg {
  max-width: min(72ch, 90%); padding: 0.65rem 0.9rem;
  border-radius: 0.75rem; line-height: 1.55; font-size: 0.875rem;
  white-space: pre-wrap; word-break: break-word;
}
.msg.markdown {
  white-space: normal;
}
.msg.markdown p,
.msg.markdown ul,
.msg.markdown ol,
.msg.markdown blockquote,
.msg.markdown pre,
.msg.markdown table {
  margin: 0.55rem 0;
}
.msg.markdown p:first-child,
.msg.markdown ul:first-child,
.msg.markdown ol:first-child,
.msg.markdown blockquote:first-child,
.msg.markdown pre:first-child,
.msg.markdown table:first-child { margin-top: 0; }
.msg.markdown p:last-child,
.msg.markdown ul:last-child,
.msg.markdown ol:last-child,
.msg.markdown blockquote:last-child,
.msg.markdown pre:last-child,
.msg.markdown table:last-child { margin-bottom: 0; }
.msg.markdown h1,
.msg.markdown h2,
.msg.markdown h3,
.msg.markdown h4 {
  margin: 0.75rem 0 0.4rem;
  line-height: 1.25;
  color: var(--accent-bright);
}
.msg.markdown h1 { font-size: 1.25rem; }
.msg.markdown h2 { font-size: 1.12rem; }
.msg.markdown h3 { font-size: 1rem; }
.msg.markdown h4 { font-size: 0.94rem; }
.msg.markdown ul,
.msg.markdown ol { padding-left: 1.25rem; }
.msg.markdown li + li { margin-top: 0.2rem; }
.msg.markdown a { color: var(--info); text-decoration: none; }
.msg.markdown a:hover { text-decoration: underline; }
.msg.markdown blockquote {
  border-left: 3px solid var(--accent-dim);
  padding-left: 0.75rem;
  color: var(--text-muted);
}
.msg.markdown code {
  font-family: var(--mono);
  background: rgba(176, 38, 255, 0.12);
  border: 1px solid rgba(176, 38, 255, 0.18);
  border-radius: 0.25rem;
  padding: 0.08rem 0.25rem;
  font-size: 0.83em;
}
.msg.markdown pre {
  position: relative;
  background: #0d1117;
  border: 1px solid var(--agent-border);
  border-radius: 0.55rem;
  overflow: auto;
  padding: 0.8rem;
  box-shadow: inset 0 0 20px rgba(0, 212, 255, 0.04);
}
.msg.markdown pre code {
  display: block;
  background: transparent;
  border: none;
  border-radius: 0;
  padding: 0;
  font-size: 0.78rem;
  line-height: 1.5;
  white-space: pre;
}
.copy-code-btn {
  position: absolute;
  top: 0.35rem;
  right: 0.35rem;
  border: 1px solid var(--accent-dim);
  background: rgba(10, 10, 15, 0.85);
  color: var(--accent-bright);
  border-radius: 0.3rem;
  padding: 0.18rem 0.45rem;
  font-size: 0.66rem;
  cursor: pointer;
  opacity: 0;
  transition: opacity 0.15s, border-color 0.15s;
}
.msg.markdown pre:hover .copy-code-btn { opacity: 1; }
.copy-code-btn:hover { border-color: var(--accent); }
.msg.markdown table {
  border-collapse: collapse;
  display: block;
  overflow-x: auto;
}
.msg.markdown th,
.msg.markdown td {
  border: 1px solid var(--border);
  padding: 0.28rem 0.45rem;
}
.msg.markdown th { color: var(--accent-bright); background: rgba(176, 38, 255, 0.08); }
.msg.user  {
  align-self: flex-end;
  background: var(--user-bubble);
  border: 1px solid var(--user-border);
  margin-right: 1.25rem;
  box-shadow: 0 2px 8px rgba(176, 38, 255, 0.15);
}
.msg.agent {
  align-self: flex-start;
  background: var(--agent-bubble);
  border: 1px solid var(--agent-border);
  margin-left: 1.25rem;
  box-shadow: 0 2px 8px rgba(0, 212, 255, 0.08);
}
.msg.system {
  align-self: center;
  color: var(--text-muted);
  font-size: 0.72rem;
  background: none;
  border: none;
  max-width: 100%;
}
.msg.error-msg {
  align-self: center;
  color: var(--error);
  font-size: 0.8rem;
  background: none;
  border: none;
  text-shadow: 0 0 8px rgba(255, 0, 110, 0.4);
}
.msg.streaming { opacity: 0.9; }
.msg.streaming::after {
  content: '▌';
  opacity: 0.7;
  color: var(--accent-bright);
  animation: blink 0.8s step-end infinite;
}
@keyframes blink { 0%,100%{opacity:0.7} 50%{opacity:0} }

.thinking { display: flex; gap: 4px; align-items: center; padding: 0.65rem 0.9rem; margin-left: 1.25rem; }
.thinking span {
  width: 6px; height: 6px;
  background: var(--accent);
  border-radius: 50%;
  animation: bounce 1.2s infinite ease-in-out;
  box-shadow: 0 0 6px var(--accent-glow);
}
.thinking span:nth-child(2) { animation-delay: 0.15s; }
.thinking span:nth-child(3) { animation-delay: 0.3s; }
@keyframes bounce {
  0%,80%,100%{transform:scale(0.6);opacity:0.4;box-shadow:0 0 2px var(--accent-glow)}
  40%{transform:scale(1);opacity:1;box-shadow:0 0 10px var(--accent-glow)}
}

.tool-card {
  align-self: flex-start;
  width: min(760px, calc(100% - 2.5rem));
  margin-left: 1.25rem;
  background: rgba(10, 10, 15, 0.72);
  border: 1px solid var(--agent-border);
  border-left: 3px solid var(--info);
  border-radius: 0.65rem;
  box-shadow: 0 2px 12px rgba(0, 212, 255, 0.08);
  overflow: hidden;
}
.tool-card.running { border-left-color: var(--warn); }
.tool-card.error { border-left-color: var(--error); box-shadow: 0 2px 12px rgba(255, 0, 110, 0.1); }
.tool-card details { width: 100%; }
.tool-card summary {
  list-style: none;
  cursor: pointer;
  padding: 0.55rem 0.75rem;
  display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;
  font-size: 0.76rem;
}
.tool-card summary::-webkit-details-marker { display: none; }
.tool-card summary::before { content: '▸'; color: var(--text-muted); transition: transform 0.15s; }
.tool-card details[open] summary::before { transform: rotate(90deg); }
.tool-name { color: var(--accent-bright); font-family: var(--mono); font-weight: 700; }
.tool-status { color: var(--text-muted); font-family: var(--mono); font-size: 0.68rem; }
.tool-status.running { color: var(--warn); }
.tool-status.done { color: var(--success); }
.tool-status.error { color: var(--error); }
.tool-meta-line { color: var(--text-muted); font-family: var(--mono); font-size: 0.66rem; margin-left: auto; }
.tool-body { border-top: 1px solid var(--border); padding: 0.6rem 0.75rem 0.75rem; }
.tool-section + .tool-section { margin-top: 0.55rem; }
.tool-label { color: var(--text-muted); font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.22rem; }
.tool-pre {
  background: #0d1117;
  border: 1px solid rgba(42, 48, 72, 0.75);
  border-radius: 0.45rem;
  padding: 0.55rem 0.65rem;
  color: var(--text);
  font-family: var(--mono);
  font-size: 0.72rem;
  white-space: pre-wrap;
  word-break: break-word;
  max-height: 220px;
  overflow: auto;
}

.management-view {
  width: min(980px, calc(100% - 2rem));
  margin: 0 auto;
  padding: 0.5rem 0 1rem;
}
.management-view h2 { color: var(--accent-bright); font-size: 1.05rem; margin-bottom: 0.25rem; }
.management-subtitle { color: var(--text-muted); font-size: 0.78rem; margin-bottom: 0.85rem; }
.mgmt-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0.75rem; }
.mgmt-card {
  background: rgba(10, 10, 15, 0.62);
  border: 1px solid var(--border);
  border-radius: 0.7rem;
  padding: 0.85rem;
  box-shadow: 0 2px 12px rgba(0, 212, 255, 0.06);
}
.mgmt-card h3 { color: var(--info); font-size: 0.82rem; margin-bottom: 0.55rem; }
.kv { display: grid; grid-template-columns: minmax(90px, auto) 1fr; gap: 0.32rem 0.6rem; font-size: 0.72rem; }
.kv dt { color: var(--text-muted); }
.kv dd { color: var(--text); font-family: var(--mono); word-break: break-word; }
.mgmt-list { display: flex; flex-direction: column; gap: 0.45rem; }
.mgmt-row { border: 1px solid rgba(42, 42, 56, 0.8); border-radius: 0.5rem; padding: 0.5rem; font-size: 0.74rem; }
.mgmt-row strong { color: var(--accent-bright); }
.mgmt-row .sub { color: var(--text-muted); font-family: var(--mono); font-size: 0.68rem; margin-top: 0.18rem; }
.config-editor {
  width: 100%; min-height: 320px; resize: vertical;
  background: #0d1117; color: var(--text); border: 1px solid var(--border); border-radius: 0.55rem;
  padding: 0.75rem; font-family: var(--mono); font-size: 0.72rem; line-height: 1.45;
}
.action-row { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; margin-top: 0.6rem; }
.mini-btn {
  border: 1px solid var(--accent-dim); background: rgba(176, 38, 255, 0.12); color: var(--accent-bright);
  border-radius: 0.38rem; padding: 0.35rem 0.65rem; cursor: pointer; font-size: 0.72rem; font-weight: 600;
}
.mini-btn:hover { border-color: var(--accent); box-shadow: 0 0 10px rgba(176, 38, 255, 0.18); }
.mini-input { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 0.38rem; padding: 0.35rem 0.5rem; font-size: 0.72rem; min-width: 9rem; }
.mgmt-error { color: var(--error); font-size: 0.76rem; margin-top: 0.5rem; }
.mgmt-ok { color: var(--success); font-size: 0.76rem; margin-top: 0.5rem; }

/* ── Input area ── */
footer {
  padding: 0.75rem 1.25rem;
  background: var(--surface); border-top: 1px solid var(--border); flex-shrink: 0;
}
.run-controls {
  display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;
  margin-bottom: 0.55rem;
}
.run-controls .spacer { flex: 1; }
.control-btn {
  border: 1px solid var(--border);
  background: rgba(10, 10, 15, 0.55);
  color: var(--text-muted);
  border-radius: 0.4rem;
  padding: 0.32rem 0.65rem;
  font-size: 0.72rem;
  font-weight: 600;
  cursor: pointer;
  transition: color 0.15s, border-color 0.15s, box-shadow 0.15s, opacity 0.15s;
}
.control-btn:hover:not(:disabled) { color: var(--accent-bright); border-color: var(--accent); box-shadow: 0 0 10px rgba(176, 38, 255, 0.18); }
.control-btn.stop { color: var(--error); border-color: rgba(255, 0, 110, 0.55); }
.control-btn.stop:hover:not(:disabled) { box-shadow: 0 0 10px rgba(255, 0, 110, 0.2); }
.control-btn:disabled { opacity: 0.38; cursor: not-allowed; }
.input-row { display: flex; gap: 0.5rem; }
#input {
  flex: 1; background: var(--bg); border: 1px solid var(--border);
  border-radius: 0.5rem; padding: 0.6rem 0.85rem; color: var(--text);
  font-family: var(--font); font-size: 0.875rem; outline: none;
  resize: none; min-height: 2.5rem; max-height: 8rem; overflow-y: auto;
  field-sizing: content; transition: border-color 0.2s, box-shadow 0.2s;
}
#input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 12px rgba(176, 38, 255, 0.2), inset 0 0 20px rgba(176, 38, 255, 0.05);
}
#input::placeholder { color: var(--text-muted); }
#send {
  background: linear-gradient(135deg, var(--accent), var(--accent-dim));
  border: none; border-radius: 0.5rem;
  padding: 0.6rem 1rem; color: #fff; font-size: 0.875rem; font-weight: 600;
  cursor: pointer; flex-shrink: 0;
  transition: background 0.2s, box-shadow 0.2s, transform 0.1s;
  box-shadow: 0 2px 12px rgba(176, 38, 255, 0.3);
}
#send:hover:not(:disabled) {
  background: linear-gradient(135deg, var(--accent-hover), var(--accent));
  box-shadow: 0 4px 20px rgba(176, 38, 255, 0.5);
  transform: translateY(-1px);
}
#send:active:not(:disabled) {
  transform: translateY(0);
}
#send:disabled { opacity: 0.4; cursor: not-allowed; }
.hint {
  font-size: 0.68rem;
  color: var(--text-muted);
  margin-top: 0.35rem;
  font-style: italic;
}
.slash-menu {
  display: none; position: absolute; bottom: calc(100% + 0.35rem); left: 1.25rem;
  width: min(420px, calc(100% - 2.5rem)); background: var(--surface); border: 1px solid var(--accent-dim);
  border-radius: 0.55rem; box-shadow: 0 8px 24px rgba(0,0,0,0.35); overflow: hidden; z-index: 20;
}
.slash-menu.visible { display: block; }
.slash-item { padding: 0.45rem 0.65rem; cursor: pointer; font-size: 0.76rem; border-bottom: 1px solid rgba(42,42,56,0.5); }
.slash-item:hover, .slash-item.active { background: rgba(176, 38, 255, 0.12); color: var(--accent-bright); }
.attachment-tray { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 0.45rem; }
.attachment-chip { border: 1px solid var(--border); border-radius: 999px; padding: 0.2rem 0.5rem; color: var(--text-muted); font-size: 0.68rem; }
footer { position: relative; }
footer.drag-over { outline: 2px dashed var(--info); outline-offset: -0.35rem; }

/* ── Approval modal ── */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.65); backdrop-filter: blur(2px);
  z-index: 100; align-items: center; justify-content: center;
}
.modal-overlay.visible { display: flex; }
.modal {
  background: var(--surface);
  border: 1px solid var(--accent-dim);
  border-radius: 0.85rem; padding: 1.5rem; max-width: 640px; width: 92%;
  box-shadow: 0 8px 32px rgba(0,0,0,0.7), 0 0 40px rgba(176, 38, 255, 0.2);
}
.modal h2 {
  font-size: 1rem; margin-bottom: 0.5rem;
  color: var(--warn);
  text-shadow: 0 0 8px rgba(255, 215, 0, 0.4);
}
.approval-summary {
  display: flex; gap: 0.5rem; flex-wrap: wrap; margin: 0.8rem 0;
}
.approval-pill {
  font-size: 0.68rem; font-family: var(--mono); color: var(--text-muted);
  border: 1px solid var(--border); border-radius: 9999px; padding: 0.2rem 0.5rem;
  background: rgba(255,255,255,0.03);
}
.approval-pill.warn { color: var(--warn); border-color: var(--warn); }
.approval-meta {
  display: grid; grid-template-columns: minmax(82px, auto) 1fr; gap: 0.35rem 0.75rem;
  margin: 0.75rem 0; padding: 0.75rem; border: 1px solid var(--border);
  border-radius: 0.5rem; background: rgba(10, 10, 15, 0.45);
}
.approval-meta dt { color: var(--text-muted); font-size: 0.72rem; }
.approval-meta dd { color: var(--text); font-family: var(--mono); font-size: 0.72rem; word-break: break-all; }
.modal .cmd-box {
  background: #0d1117;
  border: 1px solid var(--accent-dim);
  border-radius: 0.5rem;
  padding: 0.75rem 0.9rem; font-family: var(--mono); font-size: 0.8rem;
  white-space: pre-wrap; word-break: break-word; margin: 0.75rem 0 1rem;
  max-height: 190px; overflow-y: auto;
  color: var(--text);
  box-shadow: inset 0 0 20px rgba(255, 215, 0, 0.05);
}
.cmd-token { color: var(--accent-bright); }
.cmd-flag { color: var(--info); }
.cmd-string { color: var(--success); }
.cmd-path { color: var(--warn); }
.modal-error {
  display: none; margin: 0 0 0.75rem; color: var(--error); font-size: 0.78rem;
}
.modal-error.visible { display: block; }
.modal-actions { display: flex; gap: 0.75rem; justify-content: flex-end; flex-wrap: wrap; }
.btn {
  padding: 0.5rem 1rem; border-radius: 0.4rem;
  font-size: 0.85rem; font-weight: 600; cursor: pointer;
  border: none;
  transition: box-shadow 0.2s, transform 0.1s, opacity 0.15s;
}
.btn:disabled { opacity: 0.45; cursor: wait; transform: none; }
.btn-deny  {
  background: rgba(255, 0, 110, 0.15);
  color: var(--error);
  border: 1px solid var(--error);
  box-shadow: 0 0 8px rgba(255, 0, 110, 0.2);
}
.btn-approve {
  background: rgba(57, 255, 20, 0.15);
  color: var(--success);
  border: 1px solid var(--success);
  box-shadow: 0 0 8px rgba(57, 255, 20, 0.2);
}
.btn-approve-once {
  background: rgba(0, 212, 255, 0.12);
  color: var(--info);
  border: 1px solid var(--info);
  box-shadow: 0 0 8px rgba(0, 212, 255, 0.18);
}
.btn:hover:not(:disabled) {
  filter: brightness(1.2);
  transform: translateY(-1px);
  box-shadow: 0 2px 12px currentColor;
}
.btn:active:not(:disabled) {
  transform: translateY(0);
}

@media (max-width: 900px) {
  body { min-width: 0; }
  header {
    padding-top: max(0.6rem, env(safe-area-inset-top));
    gap: 0.5rem;
  }
  .mobile-menu-btn { display: flex; min-width: 44px; min-height: 44px; }
  .header-info { gap: 0.45rem; font-size: 0.66rem; }
  .badge { max-width: 42vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .layout { position: relative; }
  .sidebar {
    position: fixed; top: 0; bottom: 0; left: 0;
    width: min(86vw, 320px);
    padding-top: max(0.5rem, env(safe-area-inset-top));
    padding-bottom: max(0.75rem, env(safe-area-inset-bottom));
    z-index: 80;
    transform: translateX(-105%);
    transition: transform 0.22s ease;
  }
  body.sidebar-open .sidebar { transform: translateX(0); }
  body.sidebar-open .sidebar-backdrop { display: block; }
  .tab-btn, .new-session-btn, .sidebar-item { min-height: 44px; }
  .main { min-width: 0; width: 100%; }
  #messages { padding: 0.75rem 0; }
  .msg, .tool-card { max-width: calc(100% - 1rem); width: auto; margin-left: 0.5rem; margin-right: 0.5rem; }
  .msg.user { margin-left: auto; }
  .msg.agent, .thinking, .tool-card { margin-left: 0.5rem; }
  footer {
    padding: 0.6rem max(0.75rem, env(safe-area-inset-right)) max(0.75rem, env(safe-area-inset-bottom)) max(0.75rem, env(safe-area-inset-left));
  }
  .control-btn, #send { min-height: 44px; }
  #input { min-height: 44px; max-height: 32dvh; }
}

@media (max-width: 560px) {
  header h1 { font-size: 0.88rem; }
  .header-info { margin-left: 0; }
  .run-controls .spacer { display: none; }
  .run-controls { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.4rem; }
  .control-btn { padding: 0.35rem 0.45rem; }
  .input-row { gap: 0.4rem; }
  #send { padding: 0.6rem 0.8rem; }
  .approval-meta { grid-template-columns: 1fr; }
}
</style>

<body>
<header>
  <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Open navigation" aria-expanded="false">☰</button>
  <div class="status-dot" id="dot"></div>
  <h1>Metiq</h1>
  <div class="header-actions">
    <input class="search-box" id="search-box" type="search" placeholder="Search chat…" aria-label="Search chat">
    <button class="icon-btn" id="search-toggle" title="Search chat">⌕</button>
    <button class="icon-btn" id="export-chat" title="Export chat as Markdown">Export</button>
    <button class="icon-btn" id="theme-toggle" title="Toggle theme">Theme</button>
    <select class="locale-select" id="locale-select" aria-label="Language"><option value="en">EN</option><option value="es">ES</option><option value="fr">FR</option><option value="de">DE</option><option value="ja">JA</option><option value="zh-CN">ZH-CN</option><option value="pt-BR">PT-BR</option><option value="ko">KO</option></select>
  </div>
  <div class="header-info">
    <span class="badge" id="agent-badge">agent: main</span>
    <span class="badge warn" id="approvals-badge" style="display:none">⚠ approval pending</span>
    <span id="conn-label">connecting…</span>
  </div>
</header>

<div class="layout">
  <!-- Sidebar component -->
  {{component "session_sidebar"}}

  <!-- Main conversation -->
  <div class="main">
    <div id="messages"></div>
    <footer>
      <div class="run-controls" aria-label="Run controls">
        <button class="control-btn stop" id="abort-run" disabled>Stop run</button>
        <span class="spacer"></span>
        <button class="control-btn" id="compact-session" disabled>Compact</button>
        <button class="control-btn" id="clear-session" disabled>Clear</button>
      </div>
      <div class="slash-menu" id="slash-menu" role="listbox" aria-label="Slash commands"></div>
      <div class="attachment-tray" id="attachment-tray"></div>
      <div class="input-row">
        <button class="control-btn" id="attach-btn" type="button" title="Attach files">＋</button>
        <input id="attach-input" type="file" multiple hidden>
        <textarea id="input" rows="1" placeholder="Send a message… (Shift+Enter for newline)" disabled></textarea>
        <button id="send" disabled>Send</button>
      </div>
      <p class="hint">Tip: /help for slash commands</p>
    </footer>
  </div>
</div>
<div class="sidebar-backdrop" id="sidebar-backdrop" aria-hidden="true"></div>

<!-- Extracted component templates -->
{{component "chat_message"}}
{{component "tool_card"}}

<!-- Approval modal -->
<div class="modal-overlay" id="approval-modal">
  <div class="modal">
    <h2 id="approval-title">⚠ Approval Required</h2>
    <p id="approval-subtitle" style="font-size:0.82rem;color:var(--text-muted)">Review the request metadata before deciding:</p>
    <div class="approval-summary">
      <span class="approval-pill warn" id="approval-queue-count">queue: 1</span>
      <span class="approval-pill warn" id="approval-countdown">expires: —</span>
      <span class="approval-pill" id="approval-id">id: —</span>
    </div>
    <dl class="approval-meta" id="approval-meta"></dl>
    <div class="cmd-box" id="approval-cmd"></div>
    <p class="modal-error" id="approval-error"></p>
    <div class="modal-actions">
      <button class="btn btn-deny" id="approval-deny">Deny</button>
      <button class="btn btn-approve-once" id="approval-approve-once">Allow once</button>
      <button class="btn btn-approve" id="approval-approve-always">Always allow</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.8/purify.min.js"></script>

  const connLabel = $('conn-label');
  const agentBadge      = $('agent-badge');
  const approvalsBadge  = $('approvals-badge');
  const approvalModal   = $('approval-modal');
  const approvalTitle   = $('approval-title');
  const approvalSubtitle = $('approval-subtitle');
  const approvalCmd     = $('approval-cmd');
  const approvalMeta    = $('approval-meta');
  const approvalQueueCount = $('approval-queue-count');
  const approvalCountdown  = $('approval-countdown');
  const approvalIDLabel    = $('approval-id');
  const approvalError      = $('approval-error');
  const approvalButtons    = ['approval-deny', 'approval-approve-once', 'approval-approve-always'].map($);
  const sessionsList    = $('sessions-list');
  const channelsList    = $('channels-list');
  const agentsList      = $('agents-list');
  const mobileMenuBtn   = $('mobile-menu-btn');
  const sidebarBackdrop = $('sidebar-backdrop');

  // ── State ─────────────────────────────────────────────────────────────────
  let ws, reconnectDelay = 1500;
  let connected = false;
  let pendingResolvers = {};
  let seq = 0;
  let sessionID = localStorage.getItem('metiq_session') || null;
  let activeAgentID = 'main';
  // Streaming: the current agent bubble being written to (or null).
  let streamingBubble = null;
  let streamingText = '';
  let thinkingEl = null;
  // Approval queue: pending exec/plugin approval payloads.
  let approvalQueue = [];
  let currentApprovalID = null;
  let currentApproval = null;
  let activeRun = false;
  let activeRunSessionID = null;
  let toolCards = {};
  let historyLoadingSessionID = null;
  let bufferedLiveEvents = [];
  let mainView = 'chat';
  let viewSeq = 0;
  let pendingAttachments = [];
  let attachmentReadsPending = 0;
  let attachmentReadGeneration = 0;
  const maxAttachments = 6;
  const maxAttachmentBytes = 8 * 1024 * 1024;
  const maxAttachmentTotalBytes = 20 * 1024 * 1024;
  let inputHistory = JSON.parse(localStorage.getItem('metiq_input_history') || '[]');
  let inputHistoryIndex = inputHistory.length;
  let historyBrowsing = false;
  let locale = localStorage.getItem('metiq_locale') || 'en';
  let slashCommands = [];
  const I18N = {

    es: {

      sessions: 'Sesiones', channels: 'Canales', agents: 'Agentes', dashboard: 'Panel', config: 'Config', usage: 'Uso',
      newSession: '+ Nueva sesión', loading: 'Cargando…', noSessions: 'Aún no hay sesiones', noChannels: 'No hay canales conectados', noAgents: 'No hay agentes configurados', noItems: 'Sin elementos',
      stopRun: 'Detener', compact: 'Compactar', clear: 'Borrar', tip: 'Consejo: /help para comandos', search: 'Buscar chat…', export: 'Exportar', theme: 'Tema', approvalPending: '⚠ aprobación pendiente',
      errorLoadHistory: 'No se pudo cargar el historial', noMessages: 'Esta sesión aún no tiene mensajes.'
    },
    fr: {
      send: 'Envoyer', placeholder: 'Envoyer un message… (Maj+Entrée pour une nouvelle ligne)', connected: 'Connecté. Tapez /help pour les commandes.', connecting: 'connexion…',
      sessions: 'Sessions', channels: 'Canaux', agents: 'Agents', dashboard: 'Tableau', config: 'Config', usage: 'Utilisation',
      newSession: '+ Nouvelle session', loading: 'Chargement…', noSessions: 'Aucune session', noChannels: 'Aucun canal connecté', noAgents: 'Aucun agent configuré', noItems: 'Aucun élément',
      stopRun: 'Arrêter', compact: 'Compacter', clear: 'Effacer', tip: 'Astuce : /help pour les commandes', search: 'Rechercher…', export: 'Exporter', theme: 'Thème', approvalPending: '⚠ approbation en attente',
      errorLoadHistory: 'Impossible de charger l’historique', noMessages: 'Aucun message dans cette session.'
    },
    de: {
      send: 'Senden', placeholder: 'Nachricht senden… (Umschalt+Enter für neue Zeile)', connected: 'Verbunden. /help zeigt Befehle.', connecting: 'verbinden…',
      sessions: 'Sitzungen', channels: 'Kanäle', agents: 'Agenten', dashboard: 'Übersicht', config: 'Konfig', usage: 'Nutzung',
      newSession: '+ Neue Sitzung', loading: 'Laden…', noSessions: 'Noch keine Sitzungen', noChannels: 'Keine Kanäle verbunden', noAgents: 'Keine Agenten konfiguriert', noItems: 'Keine Elemente',
      stopRun: 'Stoppen', compact: 'Kompakt', clear: 'Leeren', tip: 'Tipp: /help für Befehle', search: 'Chat suchen…', export: 'Export', theme: 'Design', approvalPending: '⚠ Genehmigung ausstehend',
      errorLoadHistory: 'Verlauf konnte nicht geladen werden', noMessages: 'Noch keine Nachrichten in dieser Sitzung.'
    },
    ja: {
      send: '送信', placeholder: 'メッセージを送信…（Shift+Enterで改行）', connected: '接続済み。/help でコマンドを表示。', connecting: '接続中…',
      sessions: 'セッション', channels: 'チャンネル', agents: 'エージェント', dashboard: 'ダッシュボード', config: '設定', usage: '使用量',
      newSession: '+ 新規セッション', loading: '読み込み中…', noSessions: 'セッションはまだありません', noChannels: '接続済みチャンネルなし', noAgents: '設定済みエージェントなし', noItems: '項目なし',
      stopRun: '停止', compact: '圧縮', clear: 'クリア', tip: 'ヒント: /help でコマンド', search: 'チャット検索…', export: 'エクスポート', theme: 'テーマ', approvalPending: '⚠ 承認待ち',
      errorLoadHistory: '履歴を読み込めません', noMessages: 'このセッションにはまだメッセージがありません。'
    },
    'zh-CN': {
      send: '发送', placeholder: '发送消息…（Shift+Enter 换行）', connected: '已连接。输入 /help 查看命令。', connecting: '连接中…',
      sessions: '会话', channels: '频道', agents: '智能体', dashboard: '仪表盘', config: '配置', usage: '用量',
      newSession: '+ 新建会话', loading: '加载中…', noSessions: '暂无会话', noChannels: '未连接频道', noAgents: '未配置智能体', noItems: '无项目',
      stopRun: '停止', compact: '压缩', clear: '清除', tip: '提示：/help 查看命令', search: '搜索聊天…', export: '导出', theme: '主题', approvalPending: '⚠ 待审批',
      errorLoadHistory: '无法加载会话历史', noMessages: '此会话暂无消息。'
    },
    'pt-BR': {
      send: 'Enviar', placeholder: 'Envie uma mensagem… (Shift+Enter para nova linha)', connected: 'Conectado. Digite /help para comandos.', connecting: 'conectando…',
      sessions: 'Sessões', channels: 'Canais', agents: 'Agentes', dashboard: 'Painel', config: 'Config', usage: 'Uso',
      newSession: '+ Nova sessão', loading: 'Carregando…', noSessions: 'Nenhuma sessão ainda', noChannels: 'Nenhum canal conectado', noAgents: 'Nenhum agente configurado', noItems: 'Nenhum item',
      stopRun: 'Parar', compact: 'Compactar', clear: 'Limpar', tip: 'Dica: /help para comandos', search: 'Buscar chat…', export: 'Exportar', theme: 'Tema', approvalPending: '⚠ aprovação pendente',
      errorLoadHistory: 'Não foi possível carregar o histórico', noMessages: 'Ainda não há mensagens nesta sessão.'
    },
    ko: {
      send: '보내기', placeholder: '메시지 보내기… (Shift+Enter로 줄바꿈)', connected: '연결됨. /help로 명령을 확인하세요.', connecting: '연결 중…',
      sessions: '세션', channels: '채널', agents: '에이전트', dashboard: '대시보드', config: '설정', usage: '사용량',
      newSession: '+ 새 세션', loading: '불러오는 중…', noSessions: '아직 세션이 없습니다', noChannels: '연결된 채널 없음', noAgents: '설정된 에이전트 없음', noItems: '항목 없음',
      stopRun: '중지', compact: '압축', clear: '지우기', tip: '팁: /help로 명령 보기', search: '채팅 검색…', export: '내보내기', theme: '테마', approvalPending: '⚠ 승인 대기',
      errorLoadHistory: '기록을 불러올 수 없습니다', noMessages: '이 세션에는 아직 메시지가 없습니다.'
    },
  };
  let approvalCountdownTimer = null;

  // ── Helpers ────────────────────────────────────────────────────────────────
  function nextID() { return 'ui-' + (++seq); }

  function t(key) {
    return (I18N[locale] && I18N[locale][key]) || I18N.en[key] || key;
  }

  function applyLocale() {
    localeSelect.value = locale;
    input.placeholder = t('placeholder');
    searchBox.placeholder = t('search');
    sendBtn.textContent = t('send');
    abortBtn.textContent = t('stopRun');
    compactBtn.textContent = t('compact');
    clearBtn.textContent = t('clear');
    exportChatBtn.textContent = t('export');
    themeToggle.textContent = t('theme');
    const hint = document.querySelector('footer .hint');
    if (hint) hint.textContent = t('tip');
    const tabLabels = { sessions: 'sessions', cron: 'cron', nodes: 'nodes', mcp: 'mcp', skills: 'skills', channels: 'channels', agents: 'agents', dashboard: 'dashboard', config: 'config', usage: 'usage' };
    document.querySelectorAll('.tab-btn').forEach(btn => {
      const key = tabLabels[btn.dataset.tab];
      if (key) btn.textContent = t(key);
    });
    const newSession = $('new-session-btn');
    if (newSession) newSession.textContent = t('newSession');
    if (connected) connLabel.textContent = t('connected');
  }

  function applyTheme(theme) {
    document.body.classList.toggle('theme-light', theme === 'light');
    localStorage.setItem('metiq_theme', theme);
  }

  function attachmentType(file) {
    if ((file.type || '').startsWith('image/')) return 'image';
    if ((file.type || '').startsWith('audio/')) return 'audio';
    if (file.type === 'application/pdf' || /\.pdf$/i.test(file.name)) return 'pdf';
    return 'file';
  }

  function composerError(message) {
    if (mainView === 'chat') addMsg('⚠️ ' + message, 'error-msg');
  }

  function updateComposerState() {
    sendBtn.disabled = !connected || attachmentReadsPending > 0;
  }

  function renderAttachments() {
    attachmentTray.innerHTML = '';
    if (attachmentReadsPending > 0) {
      const chip = document.createElement('span');
      chip.className = 'attachment-chip';
      chip.textContent = `loading ${attachmentReadsPending}…`;
      attachmentTray.appendChild(chip);
    }
    pendingAttachments.forEach((att, idx) => {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'attachment-chip';
      chip.textContent = `${att.filename} ×`;
      chip.addEventListener('click', () => {
        pendingAttachments.splice(idx, 1);
        renderAttachments();
      });
      attachmentTray.appendChild(chip);
    });
  }

  function addFiles(files) {
    const batch = Array.from(files || []);
    if (!batch.length) return;
    const currentBytes = pendingAttachments.reduce((sum, att) => sum + (att.size || 0), 0);
    let acceptedBytes = 0;
    batch.forEach(file => {
      const type = attachmentType(file);
      if (type === 'file') { composerError(`Unsupported attachment type: ${file.name}`); return; }
      if (pendingAttachments.length + attachmentReadsPending >= maxAttachments) { composerError(`Attachment limit is ${maxAttachments} files.`); return; }
      if (file.size > maxAttachmentBytes || currentBytes + acceptedBytes + file.size > maxAttachmentTotalBytes) { composerError(`Attachment too large: ${file.name}`); return; }
      acceptedBytes += file.size;
      const generation = attachmentReadGeneration;
      attachmentReadsPending++;
      updateComposerState();
      renderAttachments();
      const reader = new FileReader();
      const finish = () => { attachmentReadsPending = Math.max(0, attachmentReadsPending - 1); updateComposerState(); renderAttachments(); };
      reader.onload = () => {
        if (generation !== attachmentReadGeneration) { finish(); return; }
        const dataURL = String(reader.result || '');
        const base64 = dataURL.includes(',') ? dataURL.split(',').pop() : dataURL;
        pendingAttachments.push({ type, base64, mime_type: file.type, filename: file.name, size: file.size });
        finish();
      };
      reader.onerror = () => { composerError(`Could not read attachment: ${file.name}`); finish(); };
      reader.onabort = () => { composerError(`Attachment read cancelled: ${file.name}`); finish(); };
      reader.readAsDataURL(file);
    });
  }

  function saveInputHistory(text) {
    if (!text) return;
    inputHistory = inputHistory.filter(item => item !== text).concat(text).slice(-50);
    inputHistoryIndex = inputHistory.length;
    localStorage.setItem('metiq_input_history', JSON.stringify(inputHistory));
  }

  async function loadCommandCatalog() {
    const fallback = [
      { command: '/help', text: '/help', desc: 'Show available commands', source: 'gateway' },
      { command: '/status', text: '/status', desc: 'Show gateway status', source: 'gateway' },
    ];
    try {
      const res = connected ? await callSafe('command.catalog', {}) : await fetch('/command-catalog.json').then(r => r.json());
      const items = res.commands || res.items || res.slash_commands || fallback;
      slashCommands = items.map(item => ({
        cmd: item.cmd || item.command || item.name,
        text: item.text || item.insert || item.command || item.cmd || item.name,
        desc: item.desc || item.description || item.summary || item.source || '',
        source: item.source || item.provider || 'catalog',
      })).filter(item => item.cmd && item.cmd.startsWith('/'));
    } catch { slashCommands = fallback.map(item => ({ cmd: item.command, text: item.text, desc: item.desc, source: item.source })); }
  }

  function renderSlashMenu() {
    const q = input.value.trim().toLowerCase();
    if (!q.startsWith('/')) { slashMenu.classList.remove('visible'); return; }
    const matches = slashCommands.filter(item => item.cmd.startsWith(q) || item.desc.toLowerCase().includes(q.slice(1))).slice(0, 6);
    slashMenu.innerHTML = '';
    matches.forEach(item => {
      const el = document.createElement('div');
      el.className = 'slash-item';
      el.textContent = `${item.cmd} — ${item.desc}${item.source ? ' [' + item.source + ']' : ''}`;
      el.addEventListener('click', () => {
        input.value = item.text + ' ';
        slashMenu.classList.remove('visible');
        input.focus();
      });
      slashMenu.appendChild(el);
    });
    slashMenu.classList.toggle('visible', matches.length > 0);
  }

  function searchChat(query) {
    const q = String(query || '').trim().toLowerCase();
    if (!q) return;
    const hit = Array.from(msgs.querySelectorAll('.msg, .tool-card')).find(el => (el.textContent || '').toLowerCase().includes(q));
    if (hit) hit.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function exportChatMarkdown() {
    const lines = Array.from(msgs.querySelectorAll('.msg, .tool-card')).map(el => {
      const role = el.classList.contains('user') ? 'User' : el.classList.contains('system') ? 'System' : el.classList.contains('tool-card') ? 'Tool' : 'Agent';
      return `## ${role}\n\n${(el.textContent || '').trim()}`;
    }).filter(Boolean).join('\n\n');
    const blob = new Blob([lines || '# Metiq chat export\n'], { type: 'text/markdown' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `metiq-chat-${sessionID || 'new'}.md`;
    a.click();
    URL.revokeObjectURL(url);
  }

  function escapeHTML(text) {
    return String(text || '').replace(/[&<>"']/g, ch => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[ch]));
  }

  function renderMarkdown(text) {
    if (!window.marked || !window.DOMPurify) return escapeHTML(text).replace(/\n/g, '<br>');
    marked.setOptions({
      gfm: true,
      breaks: true,
      highlight: (code, lang) => {
        if (!window.hljs) return escapeHTML(code);
        const language = hljs.getLanguage(lang) ? lang : 'plaintext';
        return hljs.highlight(code, { language }).value;
      }
    });
    return DOMPurify.sanitize(marked.parse(text || ''), {
      ADD_ATTR: ['target', 'rel']
    });
  }

  function decorateMarkdown(el) {
    el.querySelectorAll('a[href]').forEach(a => {
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
    });
    el.querySelectorAll('pre').forEach(pre => {
      const code = pre.querySelector('code');
      if (code && window.hljs) hljs.highlightElement(code);
      if (pre.querySelector('.copy-code-btn')) return;
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'copy-code-btn';
      btn.textContent = 'Copy';
      pre.appendChild(btn);
    });
  }

  function setMessageContent(el, text, role) {
    if (role === 'agent') {
      el.classList.add('markdown');
      el.innerHTML = renderMarkdown(text);
      decorateMarkdown(el);
      return;
    }
    el.textContent = text;
  }

  function cloneComponentTemplate(id, fallbackClass) {
    const tpl = $(id);
    if (tpl && tpl.content && tpl.content.firstElementChild) {
      return tpl.content.firstElementChild.cloneNode(true);
    }
    const el = document.createElement('div');
    el.className = fallbackClass || '';
    return el;
  }

  function addMsg(text, role) {
    const el = cloneComponentTemplate('chat-message-template', 'msg');
    el.className = 'msg ' + role;
    setMessageContent(el, text, role);
    msgs.appendChild(el);
    msgs.scrollTop = msgs.scrollHeight;
    return el;
  }

  function formatValue(value) {
    if (value === undefined || value === null || value === '') return '';
    if (typeof value === 'string') {
      const trimmed = value.trim();
      if ((trimmed.startsWith('{') && trimmed.endsWith('}')) || (trimmed.startsWith('[') && trimmed.endsWith(']'))) {
        try { return JSON.stringify(JSON.parse(trimmed), null, 2); } catch { /* keep original */ }
      }
      return value;
    }
    try { return JSON.stringify(value, null, 2); } catch { return String(value); }
  }

  function firstPresent(...values) {
    return values.find(v => v !== undefined && v !== null && v !== '');
  }

  function toolKey(payload) {
    return payload.tool_call_id || payload.toolCallID || payload.call_id || payload.id ||
      [payload.tool_name || payload.name || 'tool', payload.turn_id || payload.ts_ms || Date.now()].join(':');
  }

  function toolName(payload) {
    return payload.tool_name || payload.toolName || payload.name || payload.tool || 'tool';
  }

  function toolSessionMatches(payload) {
    return !payload || !payload.session_id || !sessionID || payload.session_id === sessionID;
  }

  function addToolSection(body, label, value) {
    const rendered = formatValue(value);
    if (!rendered) return;
    const section = document.createElement('div');
    section.className = 'tool-section';
    const title = document.createElement('div');
    title.className = 'tool-label';
    title.textContent = label;
    const pre = document.createElement('pre');
    pre.className = 'tool-pre';
    pre.textContent = rendered;
    section.appendChild(title);
    section.appendChild(pre);
    body.appendChild(section);
  }

  function renderToolActivity(payload, status) {
    if (!payload || !toolSessionMatches(payload)) return;
    hideThinking();
    const key = toolKey(payload);
    let state = toolCards[key];
    if (!state) {
      const el = cloneComponentTemplate('tool-card-template', 'tool-card');
      el.className = 'tool-card';
      msgs.appendChild(el);
      state = toolCards[key] = { el, payload: {}, progress: [], status: 'started' };
    }
    state.payload = Object.assign({}, state.payload, payload);
    state.status = status || state.status;
    if (status === 'progress') {
      const progress = firstPresent(payload.result, payload.message, payload.text, payload.progress, payload.data);
      if (progress !== undefined && progress !== null && progress !== '') state.progress.push(progress);
    }
    updateToolCard(state);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function updateToolCard(state) {
    const payload = state.payload || {};
    const status = state.status || 'started';
    const isRunning = status === 'started' || status === 'progress';
    const isError = status === 'error' || !!payload.error;
    const displayStatus = isError ? 'error' : (status === 'result' ? 'done' : (isRunning ? 'running' : status));
    const el = state.el;
    el.className = 'tool-card' + (isRunning ? ' running' : '') + (isError ? ' error' : '');
    el.innerHTML = '';

    const details = document.createElement('details');
    details.open = isRunning || isError;
    const summary = document.createElement('summary');
    summary.innerHTML = `<span class="tool-name">${escapeHTML(toolName(payload))}</span>` +
      `<span class="tool-status ${escapeHTML(displayStatus)}">${escapeHTML(displayStatus)}</span>` +
      `<span class="tool-meta-line">${escapeHTML(truncate(payload.tool_call_id || payload.id || payload.turn_id || '', 34))}</span>`;
    details.appendChild(summary);

    const body = document.createElement('div');
    body.className = 'tool-body';
    const args = firstPresent(payload.args, payload.arguments, payload.tool_args, payload.toolArgs, payload.input,
      (state.status === 'started' ? payload.data : undefined));
    addToolSection(body, 'Input', args);
    if (state.progress && state.progress.length) addToolSection(body, 'Progress', state.progress);
    addToolSection(body, 'Result', payload.result);
    addToolSection(body, 'Error', payload.error);
    addToolSection(body, 'Raw event', payload);
    details.appendChild(body);
    el.appendChild(details);
  }

  function renderHistoryEntry(entry) {
    const meta = entry.meta || entry.metadata || {};
    const text = entry.text || entry.content || entry.message || '';
    const messageKind = meta.message_kind || entry.message_kind;
    const toolCalls = meta.tool_calls || entry.tool_calls || entry.toolCalls;
    const toolCallID = meta.tool_call_id || entry.tool_call_id || entry.toolCallID;

    if (Array.isArray(toolCalls) && toolCalls.length) {
      toolCalls.forEach(call => renderToolActivity({
        tool_call_id: call.id || call.tool_call_id,
        tool_name: call.name || call.tool_name || call.function_name,
        args: call.args || call.arguments || call.args_json || call.input,
        session_id: entry.session_id || sessionID,
        turn_id: entry.turn_id || entry.entry_id,
      }, 'result'));
      if (text && messageKind !== 'tool_call') addMsg(text, entry.role === 'system' ? 'system' : 'agent');
      return;
    }

    if (toolCallID || entry.role === 'tool' || messageKind === 'tool_result') {
      renderToolActivity({
        tool_call_id: toolCallID || entry.entry_id,
        tool_name: meta.tool_name || entry.tool_name || 'tool result',
        result: text || meta.tool_result,
        error: meta.tool_error || entry.error,
        session_id: entry.session_id || sessionID,
        turn_id: entry.turn_id || entry.entry_id,
      }, meta.tool_error || entry.error ? 'error' : 'result');
      return;
    }

    const role = entry.role === 'user' ? 'user' : (entry.role === 'system' ? 'system' : 'agent');
    if (text) addMsg(text, role);
  }

  function beginManagementView(title, subtitle) {
    finalizeStreaming();
    toolCards = {};
    msgs.innerHTML = '';
    const root = document.createElement('div');
    root.className = 'management-view';

    h.textContent = title;
    const sub = document.createElement('div');
    sub.className = 'management-subtitle';
    sub.textContent = subtitle || '';
    const grid = document.createElement('div');

    root.appendChild(h);
    root.appendChild(sub);
    root.appendChild(grid);
    msgs.appendChild(root);

  function addMgmtCard(grid, title) {
    const card = document.createElement('section');

    h.textContent = title;
    card.appendChild(h);

  function addKV(card, rows) {
    const dl = document.createElement('dl');
    dl.className = 'kv';
    rows.forEach(([label, value]) => {
      const dt = document.createElement('dt');
      const dd = document.createElement('dd');
      dt.textContent = label;
      dd.textContent = value === undefined || value === null || value === '' ? '—' : (typeof value === 'object' ? formatValue(value) : String(value));
      dl.appendChild(dt);
      dl.appendChild(dd);
    });
    card.appendChild(dl);
  }

  function addRows(card, items, render) {
    const list = document.createElement('div');
    list.className = 'mgmt-list';
    if (!items || !items.length) {
      const empty = document.createElement('div');
      empty.className = 'sidebar-empty';
      empty.textContent = 'No items';
      card.appendChild(empty);
      return;
    }
    items.forEach(item => {
      const row = document.createElement('div');
      row.className = 'mgmt-row';
      render(row, item);
      list.appendChild(row);
    });
    card.appendChild(list);
  }

  async function callSafe(method, params) {
    try { return await callMethod(method, params || {}); }
    catch (err) { return { error: err && err.message ? err.message : 'request failed' }; }
  }

  function resultItems(res, key) {
    if (!res || res.error) return [];
    return res[key] || res.items || [];
  }

  function addActionButton(container, label, method, paramsFn, refreshFn) {
    const btn = document.createElement('button');
    btn.className = 'mini-btn';
    btn.textContent = label;
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      const old = btn.textContent;
      btn.textContent = 'Working…';
      try { await callMethod(method, paramsFn ? paramsFn() : {}); btn.textContent = 'Done'; if (refreshFn) setTimeout(refreshFn, 250); }
      catch (err) { btn.textContent = (err && err.message) || 'Failed'; }
      finally { setTimeout(() => { btn.disabled = false; btn.textContent = old; }, 1200); }
    });
    container.appendChild(btn);
    return btn;
  }

  async function showConfigView(token) {
    const { grid } = beginManagementView('Config', 'Schema-guided configuration view with guarded JSON save.');
    const [cfgRes, schemaRes] = await Promise.all([callSafe('config.get', {}), callSafe('config.schema', {})]);
    if (!isViewCurrent('config', token)) return;
    const editorCard = addMgmtCard(grid, 'Config JSON');
    const editor = document.createElement('textarea');
    editor.className = 'config-editor';
    const configHash = cfgRes.base_hash || cfgRes.hash;
    const canSaveConfig = !!(cfgRes && !cfgRes.error && cfgRes.config && configHash);
    editor.value = canSaveConfig ? formatValue(cfgRes.config) : (cfgRes.error ? 'Could not load config: ' + cfgRes.error : 'Config unavailable; save disabled.');
    editor.readOnly = !canSaveConfig;
    const status = document.createElement('div');
    if (!canSaveConfig) {
      status.className = 'mgmt-error';
      status.textContent = 'Config save disabled until config.get returns a config and base hash.';

    actions.className = 'action-row';

    save.addEventListener('click', async () => {
      status.className = '';
      status.textContent = 'Saving…';
      try {
        if (!canSaveConfig) throw new Error('config.get did not return a saveable config');
        const parsed = JSON.parse(editor.value || '{}');
        const res = await callMethod('config.put', { config: parsed, baseHash: configHash });

      } catch (err) {
        status.className = 'mgmt-error';
        status.textContent = err && err.message ? err.message : 'Could not save config';

    editorCard.appendChild(editor);
    editorCard.appendChild(actions);
    editorCard.appendChild(status);

  function setRunActive(active, ownerSessionID) {
    if (active) {
      activeRun = true;
      activeRunSessionID = ownerSessionID || activeRunSessionID || sessionID || null;
    } else if (!ownerSessionID || !activeRunSessionID || ownerSessionID === activeRunSessionID) {
      activeRun = false;
      activeRunSessionID = null;
    }
    updateRunControls();
  }

  function selectedSessionHasActiveRun() {
    return !!(activeRun && activeRunSessionID && sessionID && activeRunSessionID === sessionID);
  }

  function updateRunControls() {
    const selectedActive = selectedSessionHasActiveRun();
    abortBtn.disabled = !connected || !selectedActive;
    compactBtn.disabled = !connected || !sessionID || selectedActive;
    clearBtn.disabled = !connected || !sessionID || selectedActive;

  function setSidebarOpen(open) {
    document.body.classList.toggle('sidebar-open', !!open);
    mobileMenuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    mobileMenuBtn.setAttribute('aria-label', open ? 'Close navigation' : 'Open navigation');
  }

  function closeSidebarOnMobile() {
    if (window.matchMedia && window.matchMedia('(max-width: 900px)').matches) setSidebarOpen(false);
  }

  function showThinking() {
    hideThinking();
    thinkingEl = document.createElement('div');
    thinkingEl.className = 'msg agent thinking';
    thinkingEl.innerHTML = '<span></span><span></span><span></span>';
    msgs.appendChild(thinkingEl);
    msgs.scrollTop = msgs.scrollHeight;

    input.disabled = !ok;

  // ── Streaming bubble management ───────────────────────────────────────────
  function startStreaming() {
    hideThinking();
    streamingText = '';
    streamingBubble = document.createElement('div');
    streamingBubble.className = 'msg agent streaming';
    streamingBubble.textContent = '';
    msgs.appendChild(streamingBubble);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function appendChunk(text) {
    if (!streamingBubble) startStreaming();
    streamingText += text;
    streamingBubble.textContent = streamingText;
    msgs.scrollTop = msgs.scrollHeight;
  }

  function finalizeStreaming() {
    if (streamingBubble) {
      streamingBubble.classList.remove('streaming');
      // Keep bubble as a normal agent message.
      if (!streamingText.trim()) {
        streamingBubble.remove();
      } else {
        setMessageContent(streamingBubble, streamingText, 'agent');
      }
      streamingBubble = null;
      streamingText = '';
    }
    hideThinking();
  }

  // ── Gateway WS protocol ───────────────────────────────────────────────────
  function sendFrame(frame) {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(frame));
  }

  function callMethod(method, params) {
    return new Promise((resolve, reject) => {
      if (!ws || ws.readyState !== WebSocket.OPEN) {
        reject({ message: 'gateway is not connected' });
        return;
      }
      const id = nextID();
      pendingResolvers[id] = { resolve, reject };
      sendFrame({ type: 'request', id, method, params: params || {} });
    });
  }

  async function loadSidebar() {
    // Load sessions, channels, agents in parallel.
    await Promise.all([loadSessions(), loadChannels(), loadAgents()]);
  }

  async function loadSessions() {
    try {
      const res = await callMethod('sessions.list', { limit: 40 });
      const sessions = res && (res.sessions || res.items || []);
      if (!sessions || !sessions.length) {
        sessionsList.innerHTML = `<div class="sidebar-empty">${escapeHTML(t('noSessions'))}</div>`;
        return;

      sessionsList.innerHTML = '';
      sessions.forEach(s => {
