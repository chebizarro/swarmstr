  function truncate(s, n) { return s && s.length > n ? s.slice(0, n) + '…' : (s || ''); }

  async function loadSessionHistory(sid) {
    historyLoadingSessionID = sid;
    bufferedLiveEvents = bufferedLiveEvents.filter(item => !(item.payload && item.payload.session_id === sid));
    try {
      const res = await callMethod('chat.history', { session_id: sid, limit: 200 });
      if (sid !== sessionID) return;
      const entries = res && (res.entries || res.items || res.transcript || []);
      msgs.innerHTML = '';
      toolCards = {};
      if (!entries || !entries.length) {
        addMsg(t('noMessages'), 'system');
        return;
      }
      entries.forEach(renderHistoryEntry);
    } catch (err) {
      if (sid !== sessionID) return;
      msgs.innerHTML = '';
      addMsg('⚠️ ' + t('errorLoadHistory') + ': ' + (err && err.message ? err.message : 'request failed'), 'error-msg');
    } finally {
      if (historyLoadingSessionID === sid) {
        historyLoadingSessionID = null;
        const replay = [];
        bufferedLiveEvents = bufferedLiveEvents.filter(item => {
          if (item.payload && item.payload.session_id === sid) {
            replay.push(item);
            return false;
          }
          return true;
        });
        replay.forEach(item => onEvent(item.event, item.payload));
      }
    }
  }

  function switchSession(sid) {
    sessionID = sid;
    localStorage.setItem('metiq_session', sid);
    mainView = 'chat';
    viewSeq++;
    updateRunControls();
    finalizeStreaming();
    toolCards = {};
    msgs.innerHTML = '';
    addMsg(t('loading') + ' session history…', 'system');
    // Update active state in sidebar.
    document.querySelectorAll('#sessions-list .sidebar-item').forEach(el => {
      el.classList.toggle('active', el.dataset.sid === sid);
    });
    loadSessionHistory(sid);
  }

  // ── Approval queue management ─────────────────────────────────────────────
  function enqueueApproval(payloadOrID, command, kind) {
    const payload = typeof payloadOrID === 'object' && payloadOrID !== null
      ? Object.assign({}, payloadOrID)
      : { id: payloadOrID, command };
    payload.kind = payload.kind || payload.approval_kind || kind || 'exec';
    payload.id = payload.id || payload.request_id || payload.approval_id;
    if (!payload.id) return;
    if (approvalQueue.some(a => a.id === payload.id)) return;
    approvalQueue.push(payload);
    updateApprovalBadge();
    if (!currentApprovalID) showNextApproval();
  }

  function updateApprovalBadge() {
    approvalsBadge.style.display = approvalQueue.length ? '' : 'none';
    approvalsBadge.textContent = approvalQueue.length > 1
      ? `⚠ ${approvalQueue.length} approvals pending`
      : t('approvalPending');
    approvalQueueCount.textContent = `queue: ${approvalQueue.length}`;
  }

  function showNextApproval() {
    if (approvalCountdownTimer) {
      clearInterval(approvalCountdownTimer);
      approvalCountdownTimer = null;
    }
    if (!approvalQueue.length) {
      currentApprovalID = null;
      currentApproval = null;
      approvalModal.classList.remove('visible');
      approvalsBadge.style.display = 'none';
      return;
    }
    const a = approvalQueue[0];
    currentApprovalID = a.id;
    currentApproval = a;
    approvalError.classList.remove('visible');
    approvalError.textContent = '';
    setApprovalBusy(false);
    renderApproval(a);
    const alwaysBtn = $('approval-approve-always');
    if (alwaysBtn) alwaysBtn.disabled = !a.allow_always_available;
    approvalModal.classList.add('visible');
  }

  function renderApproval(a) {
    updateApprovalBadge();
    const isPlugin = a.kind === 'plugin';
    approvalTitle.textContent = isPlugin ? '⚠ Plugin Approval Required' : '⚠ Exec Approval Required';
    approvalSubtitle.textContent = isPlugin
      ? 'Review plugin identity, permissions, and requested operation before deciding:'
      : 'Review the command metadata before deciding:';
    approvalIDLabel.textContent = 'id: ' + truncate(a.id, 28);
    approvalCmd.innerHTML = isPlugin ? escapeHTML(resolveApprovalCommand(a)) : highlightCommand(resolveApprovalCommand(a));
    approvalMeta.innerHTML = '';
    [
      ['Type', a.kind || 'exec'],
      ['Plugin', a.plugin_id || a.pluginId || a.name],
      ['Operation', a.operation || a.action || a.requested_action],
      ['Permissions', a.permissions || a.requested_permissions || a.scopes],
      ['Agent', a.agent_id || a.agentId || (a.system_run_plan && a.system_run_plan.agentId)],
      ['Session', a.session_id || a.sessionKey || (a.system_run_plan && a.system_run_plan.sessionKey)],
      ['CWD', a.cwd || (a.system_run_plan && a.system_run_plan.cwd)],
      ['Host', a.host],
      ['Node', a.node_id || a.nodeId],
      ['Summary', a.analysis_summary],
      ['Warnings', a.analysis_warnings],
      ['Signature', a.analysis_signature],
      ['Mode', a.approval_mode],
      ['Allow always', a.allow_always_available ? (a.allow_always_reason || 'available') : (a.allow_always_reason || 'not available')],
    ].forEach(([label, value]) => addApprovalMeta(label, value || '—'));
    updateApprovalCountdown(a);
    if (a.expires_at) {
      approvalCountdownTimer = setInterval(() => updateApprovalCountdown(a), 1000);
    }
  }

  function addApprovalMeta(label, value) {
    const dt = document.createElement('dt');
    const dd = document.createElement('dd');
    dt.textContent = label;
    dd.textContent = typeof value === 'object' ? formatValue(value) : String(value || '—');
    approvalMeta.appendChild(dt);
    approvalMeta.appendChild(dd);
  }

  function resolveApprovalCommand(a) {
    if (a.kind === 'plugin') {
      return a.summary || a.reason || a.description || formatValue({
        plugin: a.plugin_id || a.pluginId || a.name,
        operation: a.operation || a.action,
        permissions: a.permissions || a.requested_permissions || a.scopes,
      });
    }
    if (a.system_run_plan) {
      return a.system_run_plan.commandPreview || a.system_run_plan.commandText || (a.system_run_plan.argv || []).join(' ');
    }
    if (Array.isArray(a.command_argv) && a.command_argv.length) return a.command_argv.join(' ');
    return a.command || a.id;
  }

  function highlightCommand(command) {
    return escapeHTML(command || '').replace(/("[^"]*"|'[^']*'|\s--?[^\s]+|(?:^|\s)(?:\.\.?\/|\/)[^\s]+)/g, token => {
      const leading = token.match(/^\s/) ? token[0] : '';
      const body = leading ? token.slice(1) : token;
      let cls = 'cmd-token';
      if (body.startsWith('-')) cls = 'cmd-flag';
      else if (body.startsWith('"') || body.startsWith("'")) cls = 'cmd-string';
      else if (body.startsWith('/') || body.startsWith('./') || body.startsWith('../')) cls = 'cmd-path';
      return leading + `<span class="${cls}">${body}</span>`;
    });
  }

  function updateApprovalCountdown(a) {
    if (!a.expires_at) {
      approvalCountdown.textContent = 'expires: —';
      return;
    }
    const remaining = Math.max(0, a.expires_at - Date.now());
    approvalCountdown.textContent = 'expires: ' + Math.ceil(remaining / 1000) + 's';
  }

  function setApprovalBusy(busy) {
    approvalButtons.forEach(btn => { btn.disabled = busy; });
    if (!busy && currentApproval) {
      const alwaysBtn = $('approval-approve-always');
      if (alwaysBtn) alwaysBtn.disabled = !currentApproval.allow_always_available;
    }
  }

  async function resolveApproval(decision) {
    if (!currentApprovalID) return;
    const id = currentApprovalID;
    setApprovalBusy(true);
    approvalError.classList.remove('visible');
    approvalError.textContent = '';
    try {
      const approval = currentApproval || approvalQueue.find(a => a.id === id) || {};
      const normalizedDecision = decision === 'approve_always' ? 'approve' : decision;
      const params = { id, decision: normalizedDecision };
      if (approval.plugin_id || approval.pluginId) params.plugin_id = approval.plugin_id || approval.pluginId;
      if (decision === 'approve_always') params.reason = 'always allow selected in web UI';
      const method = approval.kind === 'plugin'
        ? (approval.resolve_method || approval.method || 'plugins.approval.resolve')
        : 'exec.approval.resolve';
      await callMethod(method, params);
      approvalQueue = approvalQueue.filter(a => a.id !== id);
      currentApprovalID = null;
      currentApproval = null;
      approvalModal.classList.remove('visible');
      showNextApproval();
    } catch (e) {
      approvalError.textContent = 'Could not resolve approval: ' + (e && e.message ? e.message : 'request failed');
      approvalError.classList.add('visible');
      setApprovalBusy(false);
    }
  }

  $('approval-approve-once').addEventListener('click', () => resolveApproval('approve'));
  $('approval-approve-always').addEventListener('click', () => resolveApproval('approve_always'));
  $('approval-deny').addEventListener('click', () => resolveApproval('deny'));

  msgs.addEventListener('click', async e => {
    const btn = e.target.closest('.copy-code-btn');
    if (!btn) return;
    const pre = btn.closest('pre');
    const code = pre && pre.querySelector('code');
    if (!code) return;
    try {
      await navigator.clipboard.writeText(code.textContent || '');
      btn.textContent = 'Copied';
      setTimeout(() => { btn.textContent = 'Copy'; }, 1200);
    } catch {
      btn.textContent = 'Failed';
      setTimeout(() => { btn.textContent = 'Copy'; }, 1200);
    }
  });

  // ── Tab switching ─────────────────────────────────────────────────────────
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      $('tab-' + btn.dataset.tab).classList.add('active');
      if (btn.dataset.view === 'sessions') {
        mainView = 'sessions';
        openManagementView('sessions');
      } else if (btn.dataset.view && btn.dataset.view !== 'chat') {
        openManagementView(btn.dataset.view);
      } else {
        mainView = 'chat';
        viewSeq++;
        closeSidebarOnMobile();
        if (sessionID) loadSessionHistory(sessionID);
        else if (!msgs.textContent.trim()) addMsg('New conversation started.', 'system');
      }
    });
  });

  $('new-session-btn').addEventListener('click', () => {
    sessionID = null;
    localStorage.removeItem('metiq_session');
    mainView = 'chat';
    viewSeq++;
    finalizeStreaming();
    toolCards = {};
    msgs.innerHTML = '';
    addMsg('New conversation started.', 'system');
    document.querySelectorAll('#sessions-list .sidebar-item').forEach(el => el.classList.remove('active'));
    updateRunControls();
    input.focus();
  });

  async function abortCurrentRun() {
    if (!connected || !selectedSessionHasActiveRun()) return;
    const runSessionID = activeRunSessionID;
    abortBtn.disabled = true;
    try {
      await callMethod('chat.abort', { session_id: runSessionID });
      finalizeStreaming();
      setRunActive(false, runSessionID);
      addMsg('Run stopped.', 'system');
    } catch (err) {
      abortBtn.disabled = false;
      addMsg('⚠️ Could not stop run: ' + (err && err.message ? err.message : 'request failed'), 'error-msg');
    }
  }

  async function clearCurrentSession() {
    if (!sessionID || !connected || selectedSessionHasActiveRun()) return;
    if (!confirm('Clear this session transcript?')) return;
    const sid = sessionID;
    clearBtn.disabled = true;
    try {
      await callMethod('sessions.reset', { session_id: sid });
      if (sid !== sessionID) return;
      finalizeStreaming();
      toolCards = {};
      msgs.innerHTML = '';
      addMsg('Session cleared.', 'system');
      loadSessions();
    } catch (err) {
      addMsg('⚠️ Could not clear session: ' + (err && err.message ? err.message : 'request failed'), 'error-msg');
    } finally {
      updateRunControls();
    }
  }

  async function compactCurrentSession() {
    if (!sessionID || !connected || selectedSessionHasActiveRun()) return;
    compactBtn.disabled = true;
    try {
      const res = await callMethod('sessions.compact', { session_id: sessionID });
      const dropped = res && (res.dropped || res.dropped_count || res.droppedCount);
      addMsg(dropped ? `Session compacted; dropped ${dropped} entries.` : 'Session compacted.', 'system');
      loadSessionHistory(sessionID);
      loadSessions();
    } catch (err) {
      addMsg('⚠️ Could not compact session: ' + (err && err.message ? err.message : 'request failed'), 'error-msg');
    } finally {
      updateRunControls();
    }
  }

  // ── WS event dispatcher ───────────────────────────────────────────────────
  function shouldBufferLiveEvent(event, payload) {
    if (mainView !== 'chat' || !historyLoadingSessionID || !payload || payload.session_id !== historyLoadingSessionID) return false;
    return event === 'agent.status' || event === 'chat.chunk' || event === 'chat.message' ||
      event === 'tool.start' || event === 'tool.progress' || event === 'tool.result' || event === 'tool.error' ||
      event === 'turn.result' || event === 'turn.finish' || event === 'turn.error';
  }

  function onEvent(event, payload) {
    if (shouldBufferLiveEvent(event, payload)) {
      bufferedLiveEvents.push({ event, payload });
      return;
    }
    switch (event) {
      case 'agent.status':
        if (payload) {
          activeAgentID = payload.agent_id || activeAgentID;
          agentBadge.textContent = 'agent: ' + activeAgentID;
          if (mainView === 'chat' && payload.status === 'thinking' && payload.session_id === sessionID) {
            if (!streamingBubble) showThinking();
          }
          if (mainView === 'chat' && payload.status === 'idle' && payload.session_id === sessionID) {
            if (!streamingBubble) hideThinking();
          }
        }
        break;
      case 'chat.chunk':
        if (payload && payload.session_id === sessionID) {
          if (payload.done) {
            if (mainView === 'chat') finalizeStreaming();
            setRunActive(false, payload.session_id);
            loadSessions(); // Refresh session list after reply.
          } else if (payload.text) {
            setRunActive(true, payload.session_id);
            if (mainView === 'chat') appendChunk(payload.text);
          }
        }
        break;
      case 'chat.message':
        if (mainView === 'chat' && payload && (!payload.session_id || payload.session_id === sessionID) && payload.direction === 'outbound' && !streamingBubble) {
          hideThinking();
          if (payload.text) addMsg(payload.text, 'agent');
        }
        break;
      case 'tool.start':
        setRunActive(true, payload && payload.session_id);
        if (mainView === 'chat') renderToolActivity(payload, 'started');
        break;
      case 'tool.progress':
        if (mainView === 'chat') renderToolActivity(payload, 'progress');
        break;
      case 'tool.result':
        if (mainView === 'chat') renderToolActivity(payload, 'result');
        break;
      case 'tool.error':
        if (mainView === 'chat') renderToolActivity(payload, 'error');
        break;
      case 'turn.result':
      case 'turn.finish':
      case 'turn.error':
        setRunActive(false, payload && payload.session_id);
        if (!payload || toolSessionMatches(payload)) {
          if (mainView === 'chat') finalizeStreaming();
          loadSessions();
          if (mainView === 'chat' && payload && payload.error) addMsg('⚠️ ' + payload.error, 'error-msg');
        }
        break;
      case 'exec.approval.requested':
        if (payload) enqueueApproval(payload, null, 'exec');
        break;
      case 'exec.approval.resolved':
        if (payload && payload.id) {
          approvalQueue = approvalQueue.filter(a => a.id !== payload.id);
          if (currentApprovalID === payload.id) { currentApprovalID = null; currentApproval = null; showNextApproval(); }
          updateApprovalBadge();
        }
        break;
      case 'plugin.approval.requested':
        if (payload) enqueueApproval(payload, null, 'plugin');
        break;
      case 'plugin.approval.resolved':
        if (payload && (payload.id || payload.request_id || payload.approval_id)) {
          const id = payload.id || payload.request_id || payload.approval_id;
          approvalQueue = approvalQueue.filter(a => a.id !== id);
          if (currentApprovalID === id) { currentApprovalID = null; currentApproval = null; showNextApproval(); }
          updateApprovalBadge();
        }
        break;
      case 'config.updated':
        addMsg('Config reloaded.', 'system');
        loadAgents();
        break;
      case 'channel.message':
        // Optionally surface channel messages in a notification.
        break;
    }
  }

  // ── WebSocket connect ─────────────────────────────────────────────────────
  function connect() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(proto + '//' + location.host + WS_PATH);
    ws.binaryType = 'arraybuffer';
    ws.onopen = () => {};
    ws.onmessage = async (ev) => {
      let frame;
      try { frame = JSON.parse(ev.data); } catch { return; }

      if (frame.type === 'event') {
        if (frame.event === 'connect.challenge') {
          const nonce = frame.payload && frame.payload.nonce;
          const id = nextID();
          sendFrame({
            type: 'request', id, method: 'connect',
            params: {
              client: { id: 'metiq-webui', mode: 'local', platform: navigator.platform || 'browser', version: '0.0.0', instanceId: 'webui-' + Math.random().toString(36).slice(2) },
              min_protocol: 1, max_protocol: 10,
              auth: { token: TOKEN, nonce }
            }
          });
          pendingResolvers[id] = {
            resolve: () => {
              connected = true;
              reconnectDelay = 1500;
              setConnected(true, 'connected');
              loadSidebar();
              loadCommandCatalog();
              if (sessionID && mainView === 'chat') {
                toolCards = {};
                msgs.innerHTML = '';
                addMsg('Resuming session history…', 'system');
                updateRunControls();
                loadSessionHistory(sessionID);
              } else if (!sessionID && mainView === 'chat') {
                addMsg(t('connected'), 'system');
              }
            },
            reject: (err) => {
              setConnected(false, 'auth failed');
              addMsg('Connection refused: ' + (err && err.message || 'authentication required'), 'error-msg');
            }
          };
          return;
        }
        onEvent(frame.event, frame.payload);
        return;
      }

      if (frame.type === 'response' && frame.id) {
        const resolver = pendingResolvers[frame.id];
        delete pendingResolvers[frame.id];
        if (resolver) {
          if (frame.ok) resolver.resolve(frame.payload);
          else resolver.reject(frame.error || { message: 'request failed' });
        }
      }
    };

    ws.onerror = () => setConnected(null, 'connection error');
    ws.onclose = () => {
      connected = false;
      finalizeStreaming();
      setRunActive(false);
      setConnected(null, 'reconnecting in ' + (reconnectDelay / 1000).toFixed(1) + 's…');
      pendingResolvers = {};
      hideThinking();
      setTimeout(() => {
        reconnectDelay = Math.min(reconnectDelay * 1.5, 15000);
        connect();
      }, reconnectDelay);
    };
  }

  // ── Sending messages ──────────────────────────────────────────────────────
  async function sendMessage() {
    const text = input.value.trim();
    if (attachmentReadsPending > 0) { composerError('Attachments are still loading.'); return; }
    if ((!text && !pendingAttachments.length) || !connected) return;
    const attachments = pendingAttachments.slice();
    attachmentReadGeneration++;
    pendingAttachments = [];
    renderAttachments();
    saveInputHistory(text);
    input.value = '';
    input.style.height = '';
    addMsg(text || `[${attachments.length} attachment(s)]`, 'user');
    sendBtn.disabled = true;
    setRunActive(true, sessionID);

    // Show thinking indicator; streaming chunks will replace it.
    showThinking();

    try {
      const result = await callMethod('chat.send', { message: text, text, session_id: sessionID || undefined, attachments });
      if (result && result.session_id && result.session_id !== sessionID) {
        sessionID = result.session_id;
        localStorage.setItem('metiq_session', sessionID);
        if (activeRun && !activeRunSessionID) activeRunSessionID = sessionID;
        updateRunControls();
      }
      // If no streaming chunks arrived, render the final response from result.text.
      if (!streamingBubble && result && result.text) {
        hideThinking();
        addMsg(result.text, 'agent');
        setRunActive(false, sessionID);
        loadSessions();
      } else if (result && (result.done || result.completed || result.status === 'done')) {
        setRunActive(false, sessionID);
      }
    } catch (err) {
      finalizeStreaming();
      hideThinking();
      setRunActive(false, activeRunSessionID || sessionID);
      addMsg('⚠️ ' + (err && err.message ? err.message : 'Request failed'), 'error-msg');
    } finally {
      updateComposerState();
      input.focus();
    }
  }

  // ── Event listeners ───────────────────────────────────────────────────────
  sendBtn.addEventListener('click', sendMessage);
  attachBtn.addEventListener('click', () => attachInput.click());
  attachInput.addEventListener('change', () => { addFiles(attachInput.files); attachInput.value = ''; });
  themeToggle.addEventListener('click', () => applyTheme(document.body.classList.contains('theme-light') ? 'dark' : 'light'));
  localeSelect.addEventListener('change', () => {
    locale = localeSelect.value || 'en';
    localStorage.setItem('metiq_locale', locale);
    applyLocale();
  });
  searchToggle.addEventListener('click', () => {
    searchBox.classList.toggle('visible');
    if (searchBox.classList.contains('visible')) searchBox.focus();
  });
  searchBox.addEventListener('keydown', e => {
    if (e.key === 'Enter') searchChat(searchBox.value);
    if (e.key === 'Escape') searchBox.classList.remove('visible');
  });
  exportChatBtn.addEventListener('click', exportChatMarkdown);
  mobileMenuBtn.addEventListener('click', () => setSidebarOpen(!document.body.classList.contains('sidebar-open')));
  sidebarBackdrop.addEventListener('click', () => setSidebarOpen(false));
  window.addEventListener('keydown', e => {
    if (e.key === 'Escape') setSidebarOpen(false);
  });
  window.addEventListener('resize', () => {
    if (window.innerWidth > 900) setSidebarOpen(false);
  });
  abortBtn.addEventListener('click', abortCurrentRun);
  compactBtn.addEventListener('click', compactCurrentSession);
  clearBtn.addEventListener('click', clearCurrentSession);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); slashMenu.classList.remove('visible'); sendMessage(); }
    if (e.key === 'ArrowUp' && inputHistory.length && (!input.value || historyBrowsing)) {
      e.preventDefault();
      if (!historyBrowsing) inputHistoryIndex = inputHistory.length;
      historyBrowsing = true;
      inputHistoryIndex = Math.max(0, inputHistoryIndex - 1);
      input.value = inputHistory[inputHistoryIndex] || '';
    }
    if (e.key === 'ArrowDown' && historyBrowsing) {
      e.preventDefault();
      inputHistoryIndex = Math.min(inputHistory.length, inputHistoryIndex + 1);
      input.value = inputHistory[inputHistoryIndex] || '';
      if (inputHistoryIndex >= inputHistory.length) historyBrowsing = false;
    }
    if (e.key === 'Escape') slashMenu.classList.remove('visible');
  });
  input.addEventListener('input', () => {
    historyBrowsing = false;
    input.style.height = 'auto';
    input.style.height = input.scrollHeight + 'px';
    renderSlashMenu();
  });
  document.querySelector('footer').addEventListener('dragover', e => { e.preventDefault(); e.currentTarget.classList.add('drag-over'); });
  document.querySelector('footer').addEventListener('dragleave', e => { e.currentTarget.classList.remove('drag-over'); });
  document.querySelector('footer').addEventListener('drop', e => {
    e.preventDefault();
    e.currentTarget.classList.remove('drag-over');
    addFiles(e.dataTransfer && e.dataTransfer.files);
  });
  document.addEventListener('paste', e => {
    if (document.activeElement !== input) return;
    const files = e.clipboardData && e.clipboardData.files;
    if (files && files.length) addFiles(files);
  });

  // ── Boot ──────────────────────────────────────────────────────────────────
  applyTheme(localStorage.getItem('metiq_theme') || 'dark');
  applyLocale();
  setConnected(null, 'connecting…');
  loadCommandCatalog();
  connect();
})();
</script>
</body>
</html>
